name: Toolchain
description: Buzz's pinned toolchains, caches, Linux Tauri libraries and a Postgres with Buzz's schema, as its own CI sets them up.

runs:
  using: composite
  steps:
    - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

    - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 # v1

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        workspaces: |
          .
          desktop/src-tauri
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install Tauri dependencies (Linux)
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
          build-essential file libasound2-dev libayatana-appindicator3-dev \
          libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Start Postgres with Buzz's schema for relay and db unit tests
      shell: bash
      env:
        PGHOST: localhost
        PGPORT: "5432"
        PGUSER: buzz
        PGPASSWORD: buzz_dev
        PGDATABASE: buzz
        PGSCHEMA_PLAN_HOST: localhost
        PGSCHEMA_PLAN_PORT: "5432"
        PGSCHEMA_PLAN_DB: buzz
        PGSCHEMA_PLAN_USER: buzz
        PGSCHEMA_PLAN_PASSWORD: buzz_dev
      run: |
        docker run -d --name buzz-postgres -p 5432:5432 \
          -e POSTGRES_USER=buzz -e POSTGRES_PASSWORD=buzz_dev -e POSTGRES_DB=buzz postgres:17-alpine
        until docker exec buzz-postgres pg_isready -U buzz -d buzz -h localhost; do sleep 1; done
        ./bin/pgschema apply --file schema/schema.sql --auto-approve
        docker exec -i buzz-postgres psql -U buzz -d buzz -v ON_ERROR_STOP=1 < scripts/reconcile-schema-after-pgschema.sql
