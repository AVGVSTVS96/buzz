name: Fork CI

on:
  pull_request:
  push:
    branches: [main, "pkg/**"]
    paths:
      - ".github/**"
      - "fork/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check the tree is the baseline plus the packages
        run: python3 fork/sync.py check

      - uses: ./.github/actions/toolchain

      - name: Verify patch packages and the patched tree
        run: fork/verify
